<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار قصة الرهان | منصة اللغة العربية</title>

<style>
@font-face {
    font-family: "Sakkal Majalla";
    src: local("Sakkal Majalla");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Sakkal Majalla", "Tahoma", sans-serif;
    background:
        radial-gradient(circle at top right, rgba(198,166,91,.18), transparent 28%),
        linear-gradient(135deg, #2a1715, #4b211f 48%, #241312);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 850px;
}

.header {
    text-align: center;
    margin-bottom: 18px;
}

.header .school {
    color: #f0d995;
    font-size: 25px;
    font-weight: bold;
}

.header .platform {
    font-size: 19px;
    opacity: .9;
}

.exam-card {
    background: rgba(250,248,243,.97);
    color: #351b19;
    border-radius: 25px;
    padding: 30px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.4),
        0 0 0 1px rgba(240,217,149,.3);
    position: relative;
    overflow: hidden;
}

.exam-card::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    height: 6px;
    background: linear-gradient(
        90deg,
        #7a2837,
        #c6a65b,
        #7a2837
    );
}

.student-info {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
}

.info-item {
    background: #f3ead6;
    color: #4b211f;
    border: 1px solid #d5bb79;
    border-radius: 20px;
    padding: 5px 16px;
    font-size: 17px;
}

.progress-area {
    margin-bottom: 25px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #6c3033;
    font-size: 18px;
    margin-bottom: 7px;
}

.progress-bar {
    width: 100%;
    height: 10px;
    background: #eadfca;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7a2837, #c6a65b);
    border-radius: 20px;
    transition: width .3s ease;
}

.question-number {
    display: inline-block;
    background: #7a2837;
    color: #fff;
    padding: 6px 17px;
    border-radius: 20px;
    font-size: 18px;
    margin-bottom: 14px;
}

.question {
    font-size: 27px;
    font-weight: bold;
    line-height: 1.65;
    margin-bottom: 22px;
    color: #351b19;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.option {
    position: relative;
}

.option input {
    position: absolute;
    opacity: 0;
}

.option label {
    display: block;
    padding: 14px 18px;
    border: 2px solid #dfd0b5;
    border-radius: 15px;
    background: #fffdf9;
    color: #41201e;
    font-size: 21px;
    cursor: pointer;
    transition: .2s ease;
}

.option label:hover {
    border-color: #c6a65b;
    background: #faf3e4;
    transform: translateY(-1px);
}

.option input:checked + label {
    border-color: #7a2837;
    background: #f4e5df;
    color: #681f2d;
    box-shadow: 0 4px 12px rgba(122,40,55,.12);
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 28px;
}

button {
    font-family: inherit;
    font-size: 20px;
    border: none;
    border-radius: 14px;
    padding: 10px 27px;
    cursor: pointer;
    transition: .2s ease;
}

.btn-prev {
    background: #e7dcc7;
    color: #4b211f;
}

.btn-next,
.btn-finish {
    background: linear-gradient(135deg, #7a2837, #561d28);
    color: #fff;
    box-shadow: 0 5px 15px rgba(86,29,40,.25);
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
}

.result {
    text-align: center;
    padding: 25px 10px;
}

.result h2 {
    color: #7a2837;
    font-size: 34px;
    margin-bottom: 10px;
}

.score {
    font-size: 48px;
    color: #a37c26;
    font-weight: bold;
}

.result p {
    font-size: 21px;
}

.warning-overlay {
    position: fixed;
    inset: 0;
    background: rgba(45,8,8,.96);
    z-index: 99999;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 25px;
    text-align: center;
}

.warning-box {
    max-width: 600px;
    width: 100%;
    background: #fff8ed;
    color: #3b1717;
    border: 5px solid #9b2638;
    border-radius: 25px;
    padding: 35px 25px;
    box-shadow: 0 0 50px rgba(255,0,0,.45);
    animation: warningPulse .7s infinite alternate;
}

.warning-icon {
    font-size: 65px;
    margin-bottom: 5px;
}

.warning-box h2 {
    color: #9b2638;
    font-size: 36px;
    margin: 5px 0 12px;
}

.warning-box p {
    font-size: 23px;
    line-height: 1.7;
    margin: 8px 0;
}

.warning-box .small {
    font-size: 18px;
    color: #6a4b4b;
}

@keyframes warningPulse {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.025);
    }
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .exam-card {
        padding: 20px 15px;
        border-radius: 20px;
    }

    .question {
        font-size: 23px;
    }

    .option label {
        font-size: 19px;
    }

    .navigation button {
        padding: 9px 18px;
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="school">مدرسة مربح الحلقة الثانية بنات</div>
        <div class="platform">منصة اللغة العربية • اختبار قصة «الرهان»</div>
    </div>

    <div class="exam-card">

        <div id="studentInfo" class="student-info"></div>

        <div id="examArea">

            <div class="progress-area">
                <div class="progress-text">
                    <span id="progressText">السؤال 1 من 10</span>
                    <span id="progressPercent">10%</span>
                </div>

                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <div id="questionNumber" class="question-number"></div>

            <div id="questionText" class="question"></div>

            <div id="options" class="options"></div>

            <div class="navigation">
                <button
                    id="prevBtn"
                    class="btn-prev"
                    onclick="previousQuestion()">
                    السابق
                </button>

                <button
                    id="nextBtn"
                    class="btn-next"
                    onclick="nextQuestion()">
                    التالي
                </button>
            </div>

        </div>

        <div id="resultArea" class="result" style="display:none;"></div>

    </div>
</div>


<!-- شاشة الإنذار -->
<div id="warningOverlay" class="warning-overlay">

    <div class="warning-box">

        <div class="warning-icon">🚨</div>

        <h2>تنبيه! تم رصد مغادرة الاختبار</h2>

        <p>
            تم رصد محاولة مغادرة صفحة الاختبار أثناء الإجابة.
        </p>

        <p>
            <strong>تم قفل الاختبار تلقائيًا.</strong>
        </p>

        <p class="small">
            سيتم تحويلك إلى صفحة القفل...
        </p>

    </div>

</div>


<script>

/* =========================================================
   بيانات الأسئلة
========================================================= */

const questions = [

    {
        question: "أين كان نعمان في بداية القصة؟",
        options: [
            "على الرصيف المحاذي للسوق",
            "في منزله",
            "في المستشفى",
            "في المدرسة"
        ],
        correct: "a"
    },

    {
        question: "ما المهنة التي كان يمارسها نعمان؟",
        options: [
            "تاجرًا",
            "حمّالًا",
            "طبيبًا",
            "سائقًا"
        ],
        correct: "b"
    },

    {
        question: "لماذا كان نعمان يواصل العمل رغم تقدمه في العمر؟",
        options: [
            "لأنه يحب السوق",
            "لأنه يريد منافسة الشباب",
            "لأنه كان يخشى أن ترى زوجته جائعة أو مهانة",
            "لأنه كان يبحث عن الشهرة"
        ],
        correct: "c"
    },

    {
        question: "ماذا قال طبيب الحكومة لنعمان؟",
        options: [
            "عليك أن ترتاح يا نعمان",
            "زد ساعات عملك",
            "اذهب إلى السوق كل يوم",
            "احمل أوزانًا أكبر"
        ],
        correct: "a"
    },

    {
        question: "لماذا شعر نعمان بوخزة التحدي عندما رأى الأكياس الثلاثة؟",
        options: [
            "لأنه أراد أن يثبت أنه ما زال قادرًا على حملها",
            "لأنه كان يريد شراءها",
            "لأنه لم يكن يعرف وزنها",
            "لأنه أراد مساعدة صاحب الدكان فقط"
        ],
        correct: "a"
    },

    {
        question: "من الشخص الذي كان يستطيع حمل الأكياس الثلاثة بحسب صاحب الدكان؟",
        options: [
            "نعمان",
            "طبيب الحكومة",
            "عاشور",
            "صاحب الدكان"
        ],
        correct: "c"
    },

    {
        question: "ماذا حدث عندما حاول عاشور حمل الأكياس الثلاثة؟",
        options: [
            "نجح في حملها بسهولة",
            "طلب من نعمان مساعدته",
            "حمل كيسين فقط",
            "عجز عن حملها وقال: «لن أستطيع»"
        ],
        correct: "d"
    },

    {
        question: "كم كان أجر نعمان مقابل حمل الأكياس ووضعها في السيارة؟",
        options: [
            "خمسة قروش",
            "عشرة قروش",
            "خمسة عشر قرشًا",
            "درهم واحد"
        ],
        correct: "b"
    },

    {
        question: "ماذا حدث لنعمان بعد أن حمل الأكياس ووضعها في السيارة؟",
        options: [
            "عاد إلى العمل فورًا",
            "شعر بالدوخة وسار ببطء بعيدًا عن السوق",
            "جلس مع صاحب الدكان",
            "عاد لحمل أكياس أخرى"
        ],
        correct: "b"
    },

    {
        question: "ما الدلالة الأبرز للرهان في القصة؟",
        options: [
            "إثبات أن الشباب أقوى من الكبار",
            "إظهار أهمية المال في حياة الإنسان",
            "الكشف عن صراع نعمان مع تقدّم العمر ومحاولته إثبات قوته",
            "الدعوة إلى العمل في الأسواق"
        ],
        correct: "c"
    }

];


/* =========================================================
   المتغيرات
========================================================= */

let currentQuestion = parseInt(
    sessionStorage.getItem("currentQuestion") || "0",
    10
);

let userAnswers = JSON.parse(
    sessionStorage.getItem("userAnswers") || "{}"
);

let examCompleted = false;
let exitDetected = false;


/* =========================================================
   بيانات الطالبة
========================================================= */

const studentName = sessionStorage.getItem("studentName");
const studentGrade = sessionStorage.getItem("studentGrade");
const studentSection = sessionStorage.getItem("studentSection");


/* =========================================================
   التحقق من بيانات الطالبة
========================================================= */

if (!studentName || !studentSection) {

    window.location.replace("student.html");

}


/* =========================================================
   التحقق من قفل الاختبار
========================================================= */

if (sessionStorage.getItem("murbahExamLocked") === "true") {

    window.location.replace("locked.html");

}


/* =========================================================
   عرض بيانات الطالبة
========================================================= */

document.getElementById("studentInfo").innerHTML = `
    <div class="info-item">👩🏻‍🎓 ${studentName || ""}</div>
    <div class="info-item">${studentGrade || "الصف السابع"}</div>
    <div class="info-item">الشعبة ${studentSection || ""}</div>
`;


/* =========================================================
   عرض السؤال
========================================================= */

function showQuestion() {

    const q = questions[currentQuestion];

    if (!q) return;

    document.getElementById("questionNumber").textContent =
        `السؤال ${currentQuestion + 1}`;

    document.getElementById("questionText").textContent =
        q.question;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    const letters = ["a", "b", "c", "d"];

    q.options.forEach((option, index) => {

        const letter = letters[index];

        const div = document.createElement("div");
        div.className = "option";

        div.innerHTML = `
            <input
                type="radio"
                name="answer"
                id="option-${letter}"
                value="${letter}"
                ${userAnswers[currentQuestion] === letter ? "checked" : ""}
            >

            <label for="option-${letter}">
                ${letter.toUpperCase()} ــ ${option}
            </label>
        `;

        optionsContainer.appendChild(div);

    });


    /* حفظ الإجابة */

    document
        .querySelectorAll('input[name="answer"]')
        .forEach(input => {

            input.addEventListener("change", function() {

                userAnswers[currentQuestion] = this.value;

                sessionStorage.setItem(
                    "userAnswers",
                    JSON.stringify(userAnswers)
                );

            });

        });


    /* شريط التقدم */

    const percent =
        ((currentQuestion + 1) / questions.length) * 100;

    document.getElementById("progressFill").style.width =
        percent + "%";

    document.getElementById("progressText").textContent =
        `السؤال ${currentQuestion + 1} من ${questions.length}`;

    document.getElementById("progressPercent").textContent =
        Math.round(percent) + "%";


    /* أزرار التنقل */

    document.getElementById("prevBtn").disabled =
        currentQuestion === 0;

    const nextBtn =
        document.getElementById("nextBtn");

    if (currentQuestion === questions.length - 1) {

        nextBtn.textContent = "إنهاء الاختبار";
        nextBtn.className = "btn-finish";

    } else {

        nextBtn.textContent = "التالي";
        nextBtn.className = "btn-next";

    }

}


/* =========================================================
   السؤال التالي
========================================================= */

function nextQuestion() {

    if (!userAnswers[currentQuestion]) {

        alert("يرجى اختيار إجابة أولًا.");
        return;

    }

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        sessionStorage.setItem(
            "currentQuestion",
            currentQuestion
        );

        showQuestion();

    } else {

        finishExam();

    }

}


/* =========================================================
   السؤال السابق
========================================================= */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        sessionStorage.setItem(
            "currentQuestion",
            currentQuestion
        );

        showQuestion();

    }

}


/* =========================================================
   إنهاء الاختبار
========================================================= */

function finishExam() {

    if (examCompleted) return;

    let score = 0;

    questions.forEach((q, index) => {

        if (userAnswers[index] === q.correct) {
            score++;
        }

    });


    examCompleted = true;

    sessionStorage.setItem(
        "examCompleted",
        "true"
    );

    sessionStorage.setItem(
        "examScore",
        score
    );

    sessionStorage.removeItem("userAnswers");

    document.getElementById("examArea").style.display =
        "none";

    const resultArea =
        document.getElementById("resultArea");

    resultArea.style.display = "block";

    resultArea.innerHTML = `
        <h2>أحسنتِ، تم إنهاء الاختبار 🌷</h2>

        <div class="score">
            ${score} / ${questions.length}
        </div>

        <p>
            تم تسجيل نتيجتك بنجاح.
        </p>

        <p>
            <strong>
                شكرًا لالتزامكِ ونزاهتكِ في أداء الاختبار.
            </strong>
        </p>
    `;

}


/* =========================================================
   نظام الإنذار الصوتي
========================================================= */

let audioContext = null;
let audioActivated = false;


/*
   تفعيل الصوت بعد أول تفاعل من الطالبة.
   هذا مهم لأن المتصفحات تمنع تشغيل الصوت
   تلقائيًا قبل تفاعل المستخدم.
*/

function activateAudio() {

    if (audioActivated) return;

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;

        audioContext = new AudioContext();

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        audioActivated = true;

    } catch (error) {

        console.log("Audio activation failed:", error);

    }

}


/*
   تفعيل الصوت عند أول نقرة أو لمس أو ضغط لوحة مفاتيح.
*/

window.addEventListener(
    "pointerdown",
    activateAudio,
    { once: true }
);

window.addEventListener(
    "keydown",
    activateAudio,
    { once: true }
);


/* =========================================================
   صوت الإنذار العالي
========================================================= */

function playAlarm() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;

        if (!audioContext) {
            audioContext = new AudioContext();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }


        const now = audioContext.currentTime;


        /*
           Gain قوي لكن ضمن نطاق معقول حتى لا يحدث
           تشويه شديد للصوت.
        */

        const masterGain =
            audioContext.createGain();

        masterGain.gain.setValueAtTime(
            0.0001,
            now
        );

        masterGain.gain.linearRampToValueAtTime(
            0.9,
            now + 0.03
        );

        masterGain.connect(
            audioContext.destination
        );


        /*
           نمط إنذار متكرر عالي الوضوح.
        */

        const alarmTimes = [
            0.00,
            0.28,
            0.56,
            0.84,
            1.12,
            1.40,
            1.68,
            1.96,
            2.24,
            2.52,
            2.80,
            3.08
        ];


        alarmTimes.forEach((time, index) => {

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            /*
               تغيير النغمة بين ترددين يجعل
               الإنذار أكثر وضوحًا وإزعاجًا.
            */

            oscillator.frequency.value =
                index % 2 === 0
                    ? 1050
                    : 720;

            oscillator.type = "square";


            const start =
                now + time;

            const end =
                start + 0.20;


            gain.gain.setValueAtTime(
                0.0001,
                start
            );

            gain.gain.linearRampToValueAtTime(
                0.85,
                start + 0.025
            );

            gain.gain.setValueAtTime(
                0.85,
                end - 0.035
            );

            gain.gain.linearRampToValueAtTime(
                0.0001,
                end
            );


            oscillator.connect(gain);
            gain.connect(masterGain);


            oscillator.start(start);
            oscillator.stop(end + 0.02);

        });


        /*
           إغلاق تدريجي للصوت في النهاية.
        */

        masterGain.gain.setValueAtTime(
            0.9,
            now + 3.25
        );

        masterGain.gain.linearRampToValueAtTime(
            0.0001,
            now + 3.45
        );

    } catch (error) {

        console.log("Alarm failed:", error);

    }

}


/* =========================================================
   قفل الاختبار
========================================================= */

function lockExam(reason) {

    if (exitDetected || examCompleted) {
        return;
    }

    exitDetected = true;


    /* تسجيل سبب القفل */

    sessionStorage.setItem(
        "murbahExamLocked",
        "true"
    );

    sessionStorage.setItem(
        "lockReason",
        reason || "تم رصد مغادرة صفحة الاختبار"
    );


    /*
       تشغيل الإنذار أولًا.
    */

    playAlarm();


    /*
       إظهار شاشة التحذير.
    */

    const overlay =
        document.getElementById("warningOverlay");

    overlay.style.display = "flex";


    /*
       تحويل الطالبة إلى صفحة القفل.
    */

    setTimeout(() => {

        window.location.replace("locked.html");

    }, 900);

}


/* =========================================================
   منع الرجوع للخلف
========================================================= */

history.pushState(
    null,
    "",
    window.location.href
);

window.addEventListener(
    "popstate",
    function() {

        lockExam("محاولة استخدام زر الرجوع");

    }
);


/* =========================================================
   رصد مغادرة التبويب
========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState === "hidden" &&
            !examCompleted &&
            !exitDetected
        ) {

            lockExam("مغادرة صفحة الاختبار أو الانتقال إلى تبويب آخر");

        }

    }
);


/* =========================================================
   محاولة مغادرة الصفحة
========================================================= */

window.addEventListener(
    "beforeunload",
    function(event) {

        if (
            !examCompleted &&
            !exitDetected
        ) {

            event.preventDefault();

            event.returnValue = "";

        }

    }
);


/* =========================================================
   منع بعض اختصارات الخروج
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*

           Ctrl + R
           F5
        */

        if (
            event.ctrlKey &&
            (event.key === "w" || event.key === "r")
        ) {

            event.preventDefault();

            lockExam("محاولة إغلاق أو إعادة تحميل صفحة الاختبار");

        }


        if (event.key === "F5") {

            event.preventDefault();

            lockExam("محاولة إعادة تحميل صفحة الاختبار");

        }

    }
);
