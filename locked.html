<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تم قفل الاختبار | مدرسة مربح</title>


<style>

@font-face {
    font-family: "Sakkal Majalla";
    src: local("Sakkal Majalla");
}

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family:
        "Sakkal Majalla",
        Tahoma,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at top right,
            rgba(198,166,91,.18),
            transparent 30%
        ),

        radial-gradient(
            circle at bottom left,
            rgba(122,40,55,.18),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #321d18,
            #571f2d 55%,
            #241411
        );

    color: white;

    padding: 25px;

}


/* ==============================
   الحاوية
============================== */

.container {

    width: min(680px, 92%);

    text-align: center;

}


/* ==============================
   الهوية
============================== */

.school-name {

    color: #f0d995;

    font-size:
        clamp(
            22px,
            4vw,
            30px
        );

    font-weight: bold;

    margin-bottom: 6px;

}

.motto {

    color: #eadfca;

    font-size: 19px;

    margin-bottom: 25px;

}


/* ==============================
   البطاقة
============================== */

.lock-card {

    background:
        rgba(
            255,
            250,
            240,
            .98
        );

    color: #321d18;

    border-radius: 30px;

    padding:
        42px
        28px;

    border:
        4px solid
        #c6a65b;

    box-shadow:

        0 20px 60px
        rgba(0,0,0,.45),

        0 0 35px
        rgba(198,166,91,.18);

    animation:
        cardAppear
        .7s ease;

}


/* ==============================
   أيقونة القفل
============================== */

.lock-icon {

    width: 110px;

    height: 110px;

    margin:
        0 auto
        20px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:

        linear-gradient(
            135deg,
            #7a2837,
            #571f2d
        );

    font-size: 58px;

    box-shadow:

        0 10px 30px
        rgba(122,40,55,.3);

    animation:
        pulse
        1.4s
        infinite;

}


/* ==============================
   العنوان
============================== */

h1 {

    margin: 0;

    color: #7a2837;

    font-size:
        clamp(
            34px,
            6vw,
            48px
        );

    font-weight: bold;

}


/* ==============================
   الرسالة الرئيسية
============================== */

.main-message {

    font-size:
        clamp(
            21px,
            4vw,
            26px
        );

    line-height: 1.7;

    margin:
        15px
        0
        10px;

}


/* ==============================
   التنبيه
============================== */

.warning {

    background: #f5e8d0;

    border-right:
        5px solid
        #c6a65b;

    border-radius: 12px;

    padding:
        12px
        15px;

    margin:
        22px
        0;

    font-size: 20px;

    color: #571f2d;

}


/* ==============================
   بيانات الطالبة
============================== */

.student {

    margin-top: 15px;

    font-size: 19px;

    color: #765f4e;

}

.student strong {

    color: #571f2d;

}


/* ==============================
   زر العودة
============================== */

.home-btn {

    display: inline-block;

    margin-top: 25px;

    padding:
        12px
        30px;

    border-radius: 15px;

    background:
        #eadfca;

    color:
        #571f2d;

    text-decoration: none;

    font-size: 20px;

    font-weight: bold;

    transition: .2s;

}

.home-btn:hover {

    transform:
        translateY(-2px);

    background:
        #c6a65b;

    color:
        #321d18;

}


/* ==============================
   الحركات
============================== */

@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.07);
    }

    100% {
        transform: scale(1);
    }

}


@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* ==============================
   الهاتف
============================== */

@media (max-width: 600px) {

    body {
        padding: 18px;
    }

    .lock-card {

        padding:
            32px
            18px;

        border-radius: 23px;

    }

    .lock-icon {

        width: 90px;

        height: 90px;

        font-size: 46px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- ================= الهوية ================= -->

    <div class="school-name">

        مدرسة مربح الحلقة الثانية بنات

    </div>


    <div class="motto">

        بِالْمِيثَاقِ نَبْلُغُ الْآفَاقَ

    </div>


    <!-- ================= بطاقة القفل ================= -->

    <div class="lock-card">


        <div class="lock-icon">

            🔒

        </div>


        <h1>

            تم قفل الاختبار

        </h1>


        <p class="main-message">

            تم رصد محاولة مغادرة صفحة الاختبار أثناء الإجابة،
            ولذلك تم قفل الاختبار تلقائيًا.

        </p>


        <div class="warning">

            ⚠️ حفاظًا على نزاهة التقييم،
            لا يمكن العودة إلى الاختبار بعد مغادرة صفحته.

        </div>


        <!-- ================= بيانات الطالبة ================= -->

        <div class="student">

            الطالبة:
            <strong id="studentName">
                ---
            </strong>

        </div>


        <div class="student">

            الصف:
            <strong id="studentGrade">
                ---
            </strong>

        </div>


        <div class="student">

            الشعبة:
            <strong id="studentSection">
                ---
            </strong>

        </div>


        <!-- ================= العودة ================= -->

        <a
            href="index.html"
            class="home-btn">

            🏠 العودة إلى المنصة

        </a>


    </div>

</div>


<script>


/* =========================================
   عرض بيانات الطالبة
========================================= */

document.getElementById(
    "studentName"
).textContent =
    sessionStorage.getItem(
        "studentName"
    ) || "غير مسجل";


document.getElementById(
    "studentGrade"
).textContent =
    sessionStorage.getItem(
        "studentGrade"
    ) || "غير محدد";


document.getElementById(
    "studentSection"
).textContent =
    sessionStorage.getItem(
        "studentSection"
    ) || "غير محدد";


/* =========================================
   تثبيت حالة القفل
========================================= */

sessionStorage.setItem(
    "murbahExamLocked",
    "true"
);


/* =========================================
   منع الرجوع
========================================= */

history.pushState(
    null,
    "",
    location.href
);


window.addEventListener(
    "popstate",
    function() {

        history.pushState(
            null,
            "",
            location.href
        );

    }
);


/* =========================================
   منع العودة للصفحة السابقة
========================================= */

window.addEventListener(
    "pageshow",
    function(event) {

        if (event.persisted) {

            history.pushState(
                null,
                "",
                location.href
            );

        }

    }
);

</script>


</body>

</html>
