<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اختبار اللغة العربية | مدرسة مربح</title>

<style>
@font-face {
    font-family: "Sakkal Majalla";
    src: local("Sakkal Majalla");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Sakkal Majalla", Tahoma, Arial, sans-serif;
    background:
        radial-gradient(circle at top right, rgba(198,166,91,0.15), transparent 30%),
        linear-gradient(135deg, #faf8f3, #f1e8ef);
    color: #321d2a;
    min-height: 100vh;
}

.container {
    width: min(950px, 94%);
    margin: 30px auto;
}

.header {
    background: linear-gradient(135deg, #7a2837, #4d1d2a);
    color: white;
    border-radius: 22px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(80, 30, 45, 0.18);
    border: 2px solid #c6a65b;
}

.header h1 {
    margin: 0;
    font-size: 36px;
}

.header p {
    margin: 7px 0 0;
    font-size: 20px;
}

.student-info {
    margin-top: 18px;
    background: white;
    border: 1px solid #d7c6a0;
    border-radius: 18px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}

.info-box {
    background: #faf8f3;
    border-right: 4px solid #c6a65b;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 18px;
}

.info-box strong {
    color: #7a2837;
}

.progress-area {
    margin: 20px 0;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    margin-bottom: 7px;
}

.progress-bar {
    width: 100%;
    height: 12px;
    background: #e7dfe2;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7a2837, #c6a65b);
    transition: width 0.3s ease;
}

.question-card {
    background: white;
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    border: 1px solid #dfd1b2;
}

.question-number {
    display: inline-block;
    background: #7a2837;
    color: white;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 18px;
    margin-bottom: 15px;
}

.question {
    font-size: 27px;
    font-weight: bold;
    line-height: 1.7;
    margin-bottom: 22px;
}

.option {
    display: block;
    margin: 12px 0;
    padding: 14px 18px;
    background: #faf8f3;
    border: 2px solid #e1d9d2;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 21px;
}

.option:hover {
    border-color: #c6a65b;
    transform: translateY(-1px);
}

.option.selected {
    border-color: #7a2837;
    background: #f4e8ec;
}

.option input {
    margin-left: 10px;
    accent-color: #7a2837;
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
}

button {
    font-family: inherit;
    font-size: 20px;
    border: none;
    border-radius: 13px;
    padding: 12px 28px;
    cursor: pointer;
}

.prev-btn {
    background: #eee7e9;
    color: #4d1d2a;
}

.next-btn,
.finish-btn {
    background: #7a2837;
    color: white;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.result {
    display: none;
    margin-top: 25px;
    background: white;
    border: 2px solid #c6a65b;
    border-radius: 22px;
    padding: 30px;
    text-align: center;
}

.result h2 {
    color: #7a2837;
    font-size: 32px;
}

.score {
    font-size: 45px;
    font-weight: bold;
    color: #7a2837;
}

.warning {
    margin-top: 20px;
    padding: 13px;
    background: #fff7e6;
    border: 1px solid #e2c878;
    border-radius: 12px;
    color: #624c16;
    font-size: 17px;
    text-align: center;
}

@media (max-width: 650px) {
    .student-info {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 29px;
    }

    .question {
        font-size: 23px;
    }

    .option {
        font-size: 19px;
    }

    .navigation {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>اختبار اللغة العربية</h1>
        <p>مدرسة مربح الحلقة الثانية بنات</p>
    </div>

    <div class="student-info">
        <div class="info-box">
            👩🏻‍🎓 الطالبة:
            <strong id="studentName">—</strong>
        </div>

        <div class="info-box">
            📚 الصف:
            <strong id="studentGrade">—</strong>
        </div>

        <div class="info-box">
            🏫 الشعبة:
            <strong id="studentSection">—</strong>
        </div>
    </div>

    <div class="warning">
        ⚠️ احرصي على البقاء داخل صفحة الاختبار حتى الانتهاء وتسليم إجاباتك.
    </div>

    <div class="progress-area">
        <div class="progress-text">
            <span id="progressText">السؤال 1 من 10</span>
            <span id="answeredText">تمت الإجابة: 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="question-card">

        <div class="question-number" id="questionNumber">
            السؤال 1
        </div>

        <div class="question" id="questionText"></div>

        <div id="optionsContainer"></div>

    </div>

    <div class="navigation">

        <button
            class="prev-btn"
            id="prevBtn"
            onclick="previousQuestion()">
            ← السابق
        </button>

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()">
            التالي →
        </button>

        <button
            class="finish-btn"
            id="finishBtn"
            onclick="finishExam()"
            style="display:none;">
            إنهاء الاختبار
        </button>

    </div>

    <div class="result" id="resultBox">
        <h2>🎉 أحسنتِ!</h2>

        <p>تم تسليم الاختبار بنجاح.</p>

        <div class="score" id="scoreText"></div>

        <p id="resultDetails"></p>
    </div>

</div>


<script>

/* =========================================================
   بيانات الطالبة
========================================================= */

const studentName =
    sessionStorage.getItem("studentName") || "";

const studentGrade =
    sessionStorage.getItem("studentGrade") || "";

const studentSection =
    sessionStorage.getItem("studentSection") || "";


/* =========================================================
   التأكد من تسجيل بيانات الطالبة
========================================================= */

if (!studentName || !studentGrade || !studentSection) {
    window.location.href = "student.html";
}


/* =========================================================
   عرض بيانات الطالبة
========================================================= */

document.getElementById("studentName").textContent = studentName;
document.getElementById("studentGrade").textContent = studentGrade;
document.getElementById("studentSection").textContent = studentSection;


/* =========================================================
   نقطة الربط المستقبلية مع قاعدة البيانات
=========================================================

   في الخطوة التالية سنضع هنا رابط الخدمة التي ستستقبل
   بيانات خروج الطالبات.

   لا تغيّري شيئًا الآن.

========================================================= */

const LOG_ENDPOINT = "";


/* =========================================================
   أسئلة الاختبار
========================================================= */

const questions = [

    {
        question:
        "ما العنصر الذي يساعد القارئ على معرفة الشخصيات الرئيسة في القصة؟",

        options: [
            "الشخصيات",
            "العنوان فقط",
            "عدد الفقرات",
            "علامات الترقيم"
        ],

        answer: 0
    },

    {
        question:
        "عند تحليل شخصية في القصة، أيُّ دليل يُعد أكثر فائدة؟",

        options: [
            "تصرفاتها وأقوالها",
            "عدد صفحات القصة",
            "شكل الصفحة",
            "نوع الخط"
        ],

        answer: 0
    },

    {
        question:
        "إذا واجهت الشخصية موقفًا صعبًا واتخذت قرارًا، فما الذي يمكن للقارئ استنتاجه؟",

        options: [
            "بعض صفاتها وطريقة تفكيرها",
            "عدد الشخصيات فقط",
            "مكان نشر القصة",
            "عدد فصول الكتاب"
        ],

        answer: 0
    },

    {
        question:
        "ما العلاقة التي يمكن أن تربط بين حدث وحدث آخر في القصة؟",

        options: [
            "سبب ونتيجة",
            "عنوان وصورة",
            "خط ولون",
            "فقرة وهامش"
        ],

        answer: 0
    },

    {
        question:
        "لماذا يهتم القارئ بترتيب الأحداث في القصة؟",

        options: [
            "لفهم تطور الأحداث وترابطها",
            "لمعرفة عدد الكلمات",
            "لمعرفة حجم الكتاب",
            "لمعرفة نوع الخط"
        ],

        answer: 0
    },

    {
        question:
        "ماذا يكشف الحوار بين الشخصيات غالبًا؟",

        options: [
            "أفكار الشخصيات ومشاعرها ومواقفها",
            "عدد صفحات القصة",
            "اسم المؤلف فقط",
            "حجم النص"
        ],

        answer: 0
    },

    {
        question:
        "عندما يتغير شعور الشخصية بسبب حدث وقع لها، فإن هذا التغير يساعدنا على فهم:",

        options: [
            "تطور الشخصية",
            "شكل الكتاب",
            "عدد الفقرات",
            "نوع الورق"
        ],

        answer: 0
    },

    {
        question:
        "أي سؤال يساعد على الوصول إلى فكرة أعمق في القصة؟",

        options: [
            "ماذا نتعلم من تصرفات الشخصيات وأحداث القصة؟",
            "كم عدد الكلمات؟",
            "ما لون الغلاف؟",
            "كم عدد الأسطر؟"
        ],

        answer: 0
    },

    {
        question:
        "عند الإجابة عن سؤال تحليلي حول القصة، ماذا ينبغي أن تقدم الطالبة؟",

        options: [
            "دليلًا من أحداث القصة",
            "إجابة عشوائية",
            "رأيًا بلا تفسير",
            "معلومة من خارج القصة"
        ],

        answer: 0
    },

    {
        question:
        "ما الطريقة الأفضل لفهم موقف إحدى الشخصيات في القصة؟",

        options: [
            "ربط أقوالها وأفعالها بالأحداث",
            "قراءة العنوان فقط",
            "تجاهل الأحداث",
            "الاعتماد على التخمين فقط"
        ],

        answer: 0
    }

];


/* =========================================================
   متغيرات الاختبار
========================================================= */

let currentQuestion = 0;

let userAnswers =
    JSON.parse(sessionStorage.getItem("userAnswers") || "{}");


/* =========================================================
   منع العودة لاختبار تم إقفاله
========================================================= */

if (sessionStorage.getItem("murbahExamLocked") === "true") {
    window.location.href = "locked.html";
}


/* =========================================================
   عرض السؤال
========================================================= */

function showQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "السؤال " + (currentQuestion + 1);

    document.getElementById("questionText").textContent =
        q.question;

    const optionsContainer =
        document.getElementById("optionsContainer");

    optionsContainer.innerHTML = "";

    q.options.forEach((option, index) => {

        const label = document.createElement("label");

        label.className = "option";

        if (userAnswers[currentQuestion] === index) {
            label.classList.add("selected");
        }

        label.innerHTML = `
            <input
                type="radio"
                name="answer"
                value="${index}"
                ${userAnswers[currentQuestion] === index ? "checked" : ""}
            >
            ${option}
        `;

        label.addEventListener("click", function () {

            userAnswers[currentQuestion] = index;

            sessionStorage.setItem(
                "userAnswers",
                JSON.stringify(userAnswers)
            );

            document
                .querySelectorAll(".option")
                .forEach(el => el.classList.remove("selected"));

            label.classList.add("selected");

            updateProgress();
        });

        optionsContainer.appendChild(label);
    });

    document.getElementById("prevBtn").disabled =
        currentQuestion === 0;

    if (currentQuestion === questions.length - 1) {

        document.getElementById("nextBtn").style.display = "none";

        document.getElementById("finishBtn").style.display = "block";

    } else {

        document.getElementById("nextBtn").style.display = "block";

        document.getElementById("finishBtn").style.display = "none";
    }

    updateProgress();
}


/* =========================================================
   تحديث شريط التقدم
========================================================= */

function updateProgress() {

    const answered =
        Object.keys(userAnswers).length;

    const total =
        questions.length;

    const percentage =
        ((currentQuestion + 1) / total) * 100;

    document.getElementById("progressFill").style.width =
        percentage + "%";

    document.getElementById("progressText").textContent =
        "السؤال " + (currentQuestion + 1) +
        " من " + total;

    document.getElementById("answeredText").textContent =
        "تمت الإجابة: " + answered;
}


/* =========================================================
   السؤال السابق
========================================================= */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();
    }
}


/* =========================================================
   السؤال التالي
========================================================= */

function nextQuestion() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        showQuestion();
    }
}


/* =========================================================
   حساب النتيجة
========================================================= */

function calculateScore() {

    let score = 0;

    questions.forEach((q, index) => {

        if (userAnswers[index] === q.answer) {
            score++;
        }
    });

    return score;
}


/* =========================================================
   إنهاء الاختبار
========================================================= */

function finishExam() {

    const answered =
        Object.keys(userAnswers).length;

    if (answered < questions.length) {

        const remaining =
            questions.length - answered;

        const confirmFinish =
            confirm(
                "لم تجيبي عن " +
                remaining +
                " سؤال/أسئلة.\n\nهل تريدين إنهاء الاختبار؟"
            );

        if (!confirmFinish) {
            return;
        }
    }

    const score =
        calculateScore();

    sessionStorage.setItem(
        "examCompleted",
        "true"
    );

    sessionStorage.setItem(
        "examScore",
        score
    );

    /*
       مهم:
       عند الإنهاء الطبيعي لا نسجل خروجًا.
    */

    document.querySelector(".question-card").style.display =
        "none";

    document.querySelector(".navigation").style.display =
        "none";

    document.querySelector(".progress-area").style.display =
        "none";

    document.querySelector(".warning").style.display =
        "none";

    const resultBox =
        document.getElementById("resultBox");

    resultBox.style.display = "block";

    document.getElementById("scoreText").textContent =
        score + " / " + questions.length;

    document.getElementById("resultDetails").textContent =
        "الطالبة: " +
        studentName +
        " — " +
        studentGrade +
        " — " +
        studentSection;
}


/* =========================================================
   تسجيل خروج الطالبة
=========================================================

   هذه أهم إضافة في هذه المرحلة.

   عندما تغادر الطالبة صفحة الاختبار، نقوم بتجهيز
   سجل يحتوي على:

   - اسم الطالبة
   - الصف
   - الشعبة
   - وقت الخروج
   - سبب الخروج

   في الخطوة التالية سنربطه بمخزن بيانات مشترك
   حتى يظهر لكِ في teacher.html.

========================================================= */

let exitAlreadyLogged = false;

function createExitRecord(reason) {

    if (exitAlreadyLogged) {
        return;
    }

    /*
       إذا كانت الطالبة أنهت الاختبار بصورة طبيعية
       فلا نعتبر ذلك خروجًا.
    */

    if (sessionStorage.getItem("examCompleted") === "true") {
        return;
    }

    exitAlreadyLogged = true;

    const exitRecord = {

        studentName: studentName,

        grade: studentGrade,

        section: studentSection,

        exitTime: new Date().toISOString(),

        reason: reason,

        page: "questions.html"

    };


    /*
       حفظ نسخة محلية احتياطية.
       ستفيدنا أثناء التجربة قبل الربط الخارجي.
    */

    sessionStorage.setItem(
        "lastExitRecord",
        JSON.stringify(exitRecord)
    );


    /*
       إذا أصبح لدينا رابط الخدمة الخارجية
       في الخطوة التالية، سيتم إرسال السجل إليه.
    */

    if (LOG_ENDPOINT) {

        try {

            navigator.sendBeacon(
                LOG_ENDPOINT,
                JSON.stringify(exitRecord)
            );

        } catch (error) {

            console.log(
                "تعذر إرسال سجل الخروج:",
                error
            );
        }
    }
}


/* =========================================================
   اكتشاف مغادرة صفحة الاختبار
========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        if (document.visibilityState === "hidden") {

            createExitRecord(
                "غادرت الطالبة صفحة الاختبار"
            );

            sessionStorage.setItem(
                "murbahExamLocked",
                "true"
            );

            sessionStorage.setItem(
                "lockReason",
                "تم رصد مغادرة صفحة الاختبار."
            );
        }
    }
);


/* =========================================================
   زر الرجوع في المتصفح
========================================================= */

history.pushState(null, "", location.href);

window.addEventListener(
    "popstate",
    function () {

        createExitRecord(
            "استخدام زر الرجوع في المتصفح"
        );

        sessionStorage.setItem(
            "murbahExamLocked",
            "true"
        );

        sessionStorage.setItem(
            "lockReason",
            "تم رصد محاولة مغادرة الاختبار باستخدام زر الرجوع."
        );

        window.location.href = "locked.html";
    }
);


/* =========================================================
   محاولة إغلاق الصفحة أو الانتقال منها
========================================================= */

window.addEventListener(
    "beforeunload",
    function (event) {

        if (
            sessionStorage.getItem("examCompleted") !== "true"
        ) {

            createExitRecord(
                "محاولة إغلاق صفحة الاختبار أو مغادرتها"
            );

            sessionStorage.setItem(
                "murbahExamLocked",
                "true"
            );

            sessionStorage.setItem(
                "lockReason",
                "تم رصد مغادرة صفحة الاختبار."
            );

            event.preventDefault();

            event.returnValue = "";
        }
    }
);


/* =========================================================
   بدء الاختبار
========================================================= */

showQuestion();

</script>

</body>
</html>
